<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reading History - Lumina Script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260727h">
  <link rel="stylesheet" href="css/themes.css?v=20260727d">
  <style>
    .history-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--outline);
      background: var(--surface-alt);
      margin-bottom: 0.75rem;
      text-decoration: none;
      color: inherit;
      transition: all var(--transition-fast);
    }
    .history-item:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .history-cover {
      width: 56px;
      height: 75px;
      border-radius: var(--radius);
      object-fit: cover;
      flex-shrink: 0;
    }
    .history-info { flex: 1; min-width: 0; }
    .history-title {
      font-weight: 600;
      font-size: var(--font-label-md);
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-meta {
      font-size: 0.8rem;
      color: var(--on-surface-secondary);
    }
    .history-time {
      font-size: 0.75rem;
      color: var(--on-surface-secondary);
      white-space: nowrap;
    }
  </style>
</head>
<body data-page="history">
  <div class="app-layout">
    <aside class="sidebar">
      <a href="/" class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Lumina Script
      </a>
      <nav class="sidebar-nav"></nav>
      <button class="theme-toggle" id="theme-toggle">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span id="theme-label">Dark Mode</span>
      </button>
      <div class="theme-dots"></div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <header class="topbar">
      <button class="icon-btn hamburger-btn" aria-label="Menu" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
      <div class="topbar-center">
        <span class="topbar-title">History</span>
        <div class="theme-dots"></div>
      </div>
    </header>

    <main class="main-content" id="history-content"></main>

    <nav class="bottomnav"></nav>
  </div>

  <script src="js/supabase.min.js?v=20260727"></script>
  <script src="js/config.js?v=20260727"></script>
  <script src="js/storage.js?v=20260727"></script>
  <script src="js/nav.js?v=20260727"></script>
  <script src="js/utils.js?v=20260727"></script>
  <script src="js/themes.js?v=20260727"></script>
  <script src="js/animations.js?v=20260727"></script>
  <script>
    const content = document.getElementById('history-content');

    async function renderHistory() {
      const user = Storage.getCurrentUser();
      if (!user) {
        content.innerHTML = `
          <div class="page-header">
            <h1 class="page-title">Reading History</h1>
          </div>
          <div class="empty-state">
            <p>Login to see your reading history.</p>
            <a href="/login.html" class="btn btn-primary">Login / Sign Up</a>
          </div>
        `;
        return;
      }

      const history = await Storage.getReadingHistory();

      content.innerHTML = `
        <div class="page-header">
          <h1 class="page-title">Reading History</h1>
          <p class="page-subtitle">${history.length} novel${history.length !== 1 ? 's' : ''} read</p>
        </div>
        <div id="history-list"></div>
      `;

      if (history.length === 0) {
        document.getElementById('history-list').innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <h3>No reading history yet</h3>
            <p>Start reading to build your history!</p>
          </div>
        `;
        return;
      }

      fetch('/data/novels.json?v=20260727')
        .then(r => r.json())
        .then(async (novels) => {
          const items = await Promise.all(history.map(async (h) => {
            const novelId = h.novel_id || h.novelId;
            const chapterId = h.chapter_id || h.chapterId;
            const readAt = h.read_at || h.readAt;
            const novel = novels.find(n => n.id === novelId);
            if (!novel) return '';
            const totalChapters = novel.chapters ? novel.chapters.length : 0;
            return `
              <a href="/reader.html?novel=${novelId}&chapter=${chapterId}" class="history-item">
                <img class="history-cover" src="${novel.cover}" alt="${novel.title}" onerror="this.style.display='none'">
                <div class="history-info">
                  <div class="history-title">${novel.title}</div>
                  <div class="history-meta">Chapter ${chapterId} of ${totalChapters} read</div>
                </div>
                <span class="history-time">${timeAgo(readAt)}</span>
              </a>
            `;
          }));
          document.getElementById('history-list').innerHTML = items.join('');
        });
    }

    renderHistory();

    const themeToggle = document.getElementById('theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
    updateThemeLabel();
    themeToggle.addEventListener('click', () => { Storage.toggleTheme(); updateThemeLabel(); });
  </script>
</body>
</html>
