<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Loading... - Lumina Script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260727i">
  <link rel="stylesheet" href="css/themes.css?v=20260727d">
</head>
<body data-page="novel">
  <a href="#main-content" class="skip-to-content">Skip to content</a>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="/" class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Lumina Script
      </a>
      <nav class="sidebar-nav"></nav>
      <button class="theme-toggle" id="theme-toggle">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span id="theme-label">Dark Mode</span>
      </button>
      <div class="theme-dots"></div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <header class="topbar">
      <button class="icon-btn" aria-label="Back" onclick="window.location.href='/'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <div class="topbar-center">
        <span class="topbar-title">Novel Details</span>
        <div class="theme-dots"></div>
      </div>
    </header>

    <main class="main-content" id="main-content">
      <section class="novel-hero" id="novel-header"></section>

      <!-- Novel Actions: Status, Favorite, Rate -->
      <section class="novel-user-actions" id="novel-user-actions"></section>

      <!-- Reader Analytics -->
      <section class="analytics-section" id="analytics-section"></section>

      <div class="chapter-list-header">
        <input type="text" class="chapter-search" id="chapter-search" placeholder="Search chapters...">
        <button class="bulk-download-btn" id="bulk-download-btn" title="Download chapters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download</span>
        </button>
        <div class="chapter-list-info" id="chapter-list-info"></div>
      </div>

      <section class="chapter-list skeleton-loading" id="chapter-list">
        <!-- Skeleton chapter items will show initially -->
      </section>
      <nav class="pagination" id="pagination"></nav>

      <!-- Comments Section -->
      <section class="comments-section" id="comments-section"></section>
    </main>

    <nav class="bottomnav"></nav>
  </div>

  <script src="js/supabase.min.js?v=20260727"></script>
  <script src="js/config.js?v=20260727"></script>
  <script src="js/storage.js?v=20260727"></script>
  <script src="js/fetcher.js?v=20260727"></script>
  <script src="js/nav.js?v=20260727"></script>
  <script src="js/utils.js?v=20260727i"></script>
  <script src="js/themes.js?v=20260727"></script>
  <script src="js/animations.js?v=20260727"></script>
  <script src="js/novel.js?v=20260727"></script>
  <script src="js/download.js?v=20260728"></script>
  <script>
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    
    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
    
    updateThemeLabel();
    
    themeToggle.addEventListener('click', () => {
      Storage.toggleTheme();
      updateThemeLabel();
    });
  </script>

  <!-- Download Modal -->
  <div class="download-overlay hidden" id="download-overlay"></div>
  <div class="download-modal" id="download-modal">
    <div class="download-modal-header">
      <h3>Download Chapters</h3>
      <button class="icon-btn" id="download-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div class="download-modal-body">
      <div class="dl-setting-group">
        <label>Chapter Range</label>
        <div class="dl-range-row">
          <div class="dl-range-field">
            <label for="dl-chapter-start">From</label>
            <input type="number" id="dl-chapter-start" min="1" value="1">
          </div>
          <span class="dl-range-sep">to</span>
          <div class="dl-range-field">
            <label for="dl-chapter-end">To</label>
            <input type="number" id="dl-chapter-end" min="1" value="1">
          </div>
        </div>
      </div>
      <div class="dl-setting-group">
        <label>Format</label>
        <div class="dl-radio-group">
          <label class="dl-radio">
            <input type="radio" name="dl-format" value="single" checked>
            <span class="dl-radio-mark"></span>
            <span>Single PDF (all chapters combined)</span>
          </label>
          <label class="dl-radio">
            <input type="radio" name="dl-format" value="individual">
            <span class="dl-radio-mark"></span>
            <span>Individual chapter PDFs</span>
          </label>
        </div>
      </div>
      <div class="dl-setting-group dl-individual-opts hidden" id="dl-individual-opts">
        <label>Delivery</label>
        <div class="dl-radio-group">
          <label class="dl-radio">
            <input type="radio" name="dl-delivery" value="zip" checked>
            <span class="dl-radio-mark"></span>
            <span>Download as ZIP file</span>
          </label>
          <label class="dl-radio">
            <input type="radio" name="dl-delivery" value="individual">
            <span class="dl-radio-mark"></span>
            <span>Download each file separately</span>
          </label>
        </div>
      </div>
    </div>
    <div class="download-modal-footer">
      <button class="dl-btn dl-btn-cancel" id="download-cancel">Cancel</button>
      <button class="dl-btn dl-btn-confirm" id="download-confirm">Download</button>
    </div>
  </div>
</body>
</html>
