<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Loading... - Lumina Script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260727i">
  <link rel="stylesheet" href="css/themes.css?v=20260727d">
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to content</a>
  <div class="reader-layout" data-progress="bottom">
    <div class="reader-edge-progress" id="edge-progress">
      <div class="reader-edge-progress-bar" id="edge-progress-bar"></div>
    </div>
    <div class="reader-topbar" id="reader-topbar">
      <div class="reader-progress-top" id="progress-top">
        <div class="reader-progress-bar" id="progress-bar-top"></div>
      </div>
      <button class="icon-btn" id="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <div class="reader-chapter-title" id="chapter-title">Loading...</div>
      <button class="icon-btn" id="bookmark-btn" aria-label="Bookmark" title="Bookmark chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button id="tts-listen-btn" class="icon-btn" title="Listen to chapter" aria-label="Listen to chapter">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>

    <div class="reading-area" id="main-content">
      <div class="chapter-content" id="chapter-content">
        <div class="loading">Loading chapter...</div>
      </div>

      <!-- Chapter Comments -->
      <div class="chapter-comments" id="chapter-comments"></div>
    </div>

    <div class="reader-bottombar">
      <button class="nav-btn" id="prev-chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        <span>Previous</span>
      </button>
      <div class="progress-container" id="progress-container">
        <div class="reader-progress-bar" id="progress-bar"></div>
      </div>
      <button class="nav-btn" id="next-chapter">
        <span>Next</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>

    <div class="settings-overlay hidden" id="settings-overlay"></div>
    <div class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h3>Reading Settings</h3>
        <button class="icon-btn" id="close-settings" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <label>Chapter Navigation</label>
          <div class="settings-chapter-nav">
            <button class="settings-chapter-btn" id="settings-prev-chapter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="m15 18-6-6 6-6"/>
              </svg>
              <span>Previous Chapter</span>
            </button>
            <button class="settings-chapter-btn" id="settings-next-chapter">
              <span>Next Chapter</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="setting-group">
          <label>Progress Bar Position</label>
          <div class="progress-position-toggle">
            <button class="progress-pos-btn active" data-pos="bottom">Bottom</button>
            <button class="progress-pos-btn" data-pos="top">Top</button>
          </div>
        </div>
        <div class="setting-group">
          <label>Font Family</label>
          <select id="font-family">
            <option value="'EB Garamond', serif">EB Garamond (Reader)</option>
            <option value="'Plus Jakarta Sans', sans-serif">Plus Jakarta Sans (UI)</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="system-ui, sans-serif">System UI</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Font Size: <span id="font-size-value">18</span>px</label>
          <input type="range" id="font-size" min="14" max="28" value="18">
        </div>
        <div class="setting-group">
          <label>Line Height: <span id="line-height-value">1.8</span></label>
          <input type="range" id="line-height" min="1.4" max="2.4" step="0.1" value="1.8">
        </div>
        <div class="setting-group">
          <label>Text Width: <span id="text-width-value">800</span>px</label>
          <input type="range" id="text-width" min="600" max="1200" step="50" value="800">
        </div>
        <div class="setting-group">
          <label>Theme</label>
          <button class="theme-toggle settings-theme-toggle" id="theme-toggle">
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <span id="theme-label">Dark Mode</span>
          </button>
        </div>
        <div class="setting-group">
          <label>Reading Mode</label>
          <div id="readingModes" class="reading-modes"></div>
        </div>
        <!-- TTS Settings -->
        <div class="setting-group">
          <label>Text to Speech</label>
          <div class="tts-setting-row">
            <label for="tts-voice-select">Voice</label>
            <select id="tts-voice-select"></select>
          </div>
          <div class="tts-setting-row">
            <label for="tts-model-select">Model</label>
            <select id="tts-model-select"></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/supabase.min.js?v=20260727"></script>
  <script src="js/config.js?v=20260727"></script>
  <script src="js/storage.js?v=20260727"></script>
  <script src="js/fetcher.js?v=20260727"></script>
  <script src="js/utils.js?v=20260727i"></script>
  <script src="js/themes.js?v=20260727"></script>
  <script src="js/animations.js?v=20260727"></script>
  <script src="js/reader.js?v=20260727"></script>
  <script src="js/streaks.js?v=20260727"></script>
  <script src="js/achievements.js?v=20260727"></script>
    <script src="js/reading-modes.js?v=20260727"></script>
    <script src="js/tts.js?v=20260728"></script>
  <script>
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    
    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
    
    updateThemeLabel();
    
    themeToggle.addEventListener('click', () => {
      Storage.toggleTheme();
      updateThemeLabel();
    });
  </script>
  <!-- TTS Mini-Player -->
  <div id="tts-player" class="tts-player">
    <div class="tts-player-inner">
      <div id="tts-loading" class="tts-loading hidden">
        <div class="tts-spinner"></div>
        <span>Loading audio...</span>
      </div>
      <div class="tts-player-controls">
        <button id="tts-play-pause" class="tts-control-btn" title="Play/Pause">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        </button>
        <button id="tts-stop" class="tts-control-btn" title="Stop">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
        </button>
        <div class="tts-progress-container">
          <div id="tts-progress" class="tts-progress-bar"></div>
        </div>
        <span id="tts-chunk-info" class="tts-chunk-info hidden"></span>
        <div class="tts-speed-group">
          <button class="tts-speed-btn" data-speed="0.75">0.75x</button>
          <button class="tts-speed-btn active" data-speed="1">1x</button>
          <button class="tts-speed-btn" data-speed="1.25">1.25x</button>
          <button class="tts-speed-btn" data-speed="1.5">1.5x</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
