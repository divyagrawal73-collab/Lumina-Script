<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading... - Lumina Script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260727">
</head>
<body>
  <div class="reader-layout">
    <div class="reader-topbar">
      <button class="icon-btn" id="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <div class="reader-chapter-title" id="chapter-title">Loading...</div>
      <button class="icon-btn" id="bookmark-btn" aria-label="Bookmark" title="Bookmark chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>

    <div class="reading-area" id="reading-area">
      <div class="chapter-content" id="chapter-content">
        <div class="loading">Loading chapter...</div>
      </div>

      <!-- Chapter Comments -->
      <div class="chapter-comments" id="chapter-comments"></div>
    </div>

    <div class="reader-bottombar">
      <button class="nav-btn" id="prev-chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        Previous
      </button>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <button class="nav-btn" id="next-chapter">
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
    </div>

    <div class="settings-overlay hidden" id="settings-overlay"></div>
    <div class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h3>Reading Settings</h3>
        <button class="icon-btn" id="close-settings" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <label>Font Family</label>
          <select id="font-family">
            <option value="'EB Garamond', serif">EB Garamond (Reader)</option>
            <option value="'Plus Jakarta Sans', sans-serif">Plus Jakarta Sans (UI)</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="system-ui, sans-serif">System UI</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Font Size: <span id="font-size-value">18</span>px</label>
          <input type="range" id="font-size" min="14" max="28" value="18">
        </div>
        <div class="setting-group">
          <label>Line Height: <span id="line-height-value">1.8</span></label>
          <input type="range" id="line-height" min="1.4" max="2.4" step="0.1" value="1.8">
        </div>
        <div class="setting-group">
          <label>Theme</label>
          <button class="theme-toggle" id="theme-toggle" style="width: 100%; justify-content: center;">
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <span id="theme-label">Dark Mode</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/supabase.min.js?v=20260727"></script>
  <script src="js/config.js?v=20260727"></script>
  <script src="js/storage.js?v=20260727"></script>
  <script src="js/fetcher.js?v=20260727"></script>
  <script src="js/reader.js?v=20260727"></script>
  <script>
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    
    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
    
    updateThemeLabel();
    
    themeToggle.addEventListener('click', () => {
      Storage.toggleTheme();
      updateThemeLabel();
    });
  </script>
</body>
</html>
