<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading... - Novel Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&family=OpenDyslexic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .reader-top-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 1.25rem;
      background: var(--bg-secondary);
      backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border);
      z-index: 20;
    }
    .reader-chapter-title {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.625rem;
      border-radius: 12px;
      transition: all var(--transition-fast);
    }
    .icon-btn:hover { background: var(--bg-tertiary); }
    .reading-area {
      flex: 1;
      overflow-y: auto;
      padding: 3rem 1.5rem;
    }
    .chapter-content {
      max-width: 720px;
      margin: 0 auto;
    }
    .chapter-content p { margin-bottom: 1.5em; }
    .reader-bottom-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 1.25rem;
      background: var(--bg-secondary);
      backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--border);
    }
    .nav-btn {
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-glass);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-smooth);
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--accent-gradient);
      border-color: transparent;
      color: white;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .progress-container {
      flex: 1;
      height: 6px;
      background: var(--bg-tertiary);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent-gradient);
      width: 0%;
      transition: width var(--transition-fast);
    }
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 30;
    }
    .settings-overlay.hidden { display: none; }
    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 340px;
      height: 100vh;
      background: var(--bg-secondary);
      backdrop-filter: var(--glass-blur);
      border-left: 1px solid var(--border);
      z-index: 40;
      transform: translateX(100%);
      transition: transform var(--transition-bounce);
      display: flex;
      flex-direction: column;
    }
    .settings-panel.open { transform: translateX(0); }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .settings-body {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }
    .setting-group { display: flex; flex-direction: column; gap: 0.625rem; }
    .setting-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .setting-group select {
      padding: 0.875rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-glass);
      color: var(--text-primary);
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
    }
    .setting-group select:focus { border-color: var(--border-hover); }
    .setting-group input[type="range"] {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      background: var(--bg-tertiary);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    .setting-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: var(--accent-gradient);
      border-radius: 50%;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .settings-panel { width: 100%; }
      .nav-btn { padding: 0.625rem 1rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="reader-top-bar">
    <button class="icon-btn" id="back-btn">←</button>
    <div class="reader-chapter-title" id="chapter-title">Loading...</div>
    <button class="icon-btn" id="settings-btn">⚙</button>
  </div>

  <div class="reading-area" id="reading-area">
    <div class="chapter-content" id="chapter-content">
      <div class="loading">Loading chapter...</div>
    </div>
  </div>

  <div class="reader-bottom-bar">
    <button class="nav-btn" id="prev-chapter">← Previous</button>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <button class="nav-btn" id="next-chapter">Next →</button>
  </div>

  <div class="settings-overlay hidden" id="settings-overlay"></div>
  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <h3>Reading Settings</h3>
      <button class="icon-btn" id="close-settings">✕</button>
    </div>
    <div class="settings-body">
      <div class="setting-group">
        <label>Font Family</label>
        <select id="font-family">
          <option value="'Inter', sans-serif">Inter</option>
          <option value="'Merriweather', serif">Merriweather</option>
          <option value="'OpenDyslexic', sans-serif">OpenDyslexic</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Font Size: <span id="font-size-value">18</span>px</label>
        <input type="range" id="font-size" min="12" max="28" value="18">
      </div>
      <div class="setting-group">
        <label>Line Height: <span id="line-height-value">1.8</span></label>
        <input type="range" id="line-height" min="1.2" max="2.5" step="0.1" value="1.8">
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
