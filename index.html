<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lumina Script</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20260727e">
  <link rel="stylesheet" href="css/themes.css?v=20260727d">
</head>
<body data-page="library">
  <canvas id="particleCanvas"></canvas>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="/" class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        Lumina Script
      </a>
      <nav class="sidebar-nav"></nav>
      <button class="theme-toggle" id="theme-toggle">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <span id="theme-label">Dark Mode</span>
      </button>
      <div class="theme-dots"></div>
    </aside>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <header class="topbar">
      <button class="icon-btn hamburger-btn" aria-label="Menu" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" x2="20" y1="12" y2="12"/>
          <line x1="4" x2="20" y1="6" y2="6"/>
          <line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">Lumina Script</span>
      <div class="theme-dots" style="display:none;"></div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Library</h1>
        <p class="page-subtitle">Your personal collection of stories</p>
      </div>

      <div class="search-container">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.3-4.3"/>
          </svg>
        </span>
        <input type="text" class="search-input" id="search" placeholder="Search novels by title or author...">
      </div>

      <!-- Continue Reading Section -->
      <section id="continue-reading" class="hidden">
        <div class="section-header">
          <h2 class="section-title">Continue Reading</h2>
        </div>
        <div id="hero-card-container"></div>
      </section>

      <!-- Your Library Section -->
      <section>
        <div class="section-header">
          <h2 class="section-title">Your Library</h2>
        </div>
        <div class="book-grid skeleton-loading" id="novel-grid">
          <!-- Skeleton cards will show initially, replaced by real content -->
        </div>
      </section>
    </main>

    <nav class="bottomnav"></nav>
  </div>

  <script src="js/supabase.min.js?v=20260727"></script>
  <script src="js/config.js?v=20260727"></script>
  <script src="js/storage.js?v=20260727"></script>
  <script src="js/fetcher.js?v=20260727"></script>
  <script src="js/nav.js?v=20260727"></script>
  <script src="js/utils.js?v=20260727"></script>
  <script src="js/themes.js?v=20260727"></script>
  <script src="js/animations.js?v=20260727"></script>
  <script src="js/app.js?v=20260727"></script>
  <script src="js/particles.js?v=20260727"></script>
  <script src="js/achievements.js?v=20260727"></script>
  <script>
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeLabel = document.getElementById('theme-label');
    
    function updateThemeLabel() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
    
    updateThemeLabel();
    
    themeToggle.addEventListener('click', () => {
      Storage.toggleTheme();
      updateThemeLabel();
    });
  </script>
</body>
</html>
